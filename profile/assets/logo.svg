      font-family: Inter, Avenir Next, Helvetica Neue, Arial, sans-serif;
      font-size: 76px;
      font-weight: 720;
      letter-spacing: 0;
      fill: #111417;
    }
    .tagline {
      font-family: Inter, Avenir Next, Helvetica Neue, Arial, sans-serif;
      font-size: 22px;
      font-weight: 520;
