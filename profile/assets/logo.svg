<svg width="960" height="360" viewBox="0 0 960 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">iwantools logo</title>
  <desc id="desc">The iwantools final logo: a dark rounded nine-grid mark with amber and teal active modules, paired with a lowercase wordmark.</desc>
